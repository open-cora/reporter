site_name: Reporter
site_description: Reports what an acquisition engine did.
repo_url: https://github.com/open-cora/reporter
repo_name: open-cora/reporter
edit_uri: ""

theme:
  name: material
  custom_dir: overrides
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - toc.follow
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra_css:
  - stylesheets/theme.css

extra_javascript:
  - javascripts/hero-fade.js

extra:
  hero:
    masthead: Reporter
    tagline: Passes on what it was handed, and reads none of it.
    image: assets/hero-reporter-3600.webp
    srcset: "assets/hero-reporter-1200.webp 1200w, assets/hero-reporter-2400.webp 2400w, assets/hero-reporter-3600.webp 3600w"
    image_alt: >-
      A teletype operator in the Santa Fe Railroad telegraph office at Seligman, Arizona, 1943: a woman in profile with both hands on the keyboard, reading a message clipped to the machine's copy holder.
    credit: Jack Delano · Teletype operator, Seligman, Arizona · Library of Congress
    credit_url: https://www.loc.gov/item/2017848967/

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.highlight

nav:
  - Home: index.md
  - Reference:
      - Client contract: client-contract.md
      - Conventions: conventions.md
      - Glossary: glossary.md
